[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sioyek-selected-text-translate"
version = "0.1.0"
description = "A single-window Korean translation tool for selected Sioyek text"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
selected-text-translate = "selected_text_translate.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
